name: grocery_app
description: "Fresh Express Grocery - a bilingual (English / Gujarati) Flutter grocery app with OTP login, map address picker, 2-hour express delivery and in-app WebView pages."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.0
  shared_preferences: ^2.2.2
  # flutter_localizations pins the exact intl version per Flutter release,
  # so let the SDK decide (avoids "intl ^0.19 vs 0.20" resolution failures).
  intl: any
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  google_fonts: ^6.1.0
  latlong2: ^0.9.0
  # Code only uses APIs shared by flutter_map 6.x - 8.x (MapOptions.initialCenter,
  # TileLayer, MarkerLayer, Marker.child, MapController.move).
  flutter_map: '>=6.1.0 <9.0.0'
  geolocator: ^11.0.0
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
